name: CI — validation (no training)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
          pip install pytest

      - name: Compile all sources
        run: python -m compileall -q src scripts app.py tests

      - name: Import the Streamlit entry point
        run: python -c "import ast; ast.parse(open('app.py').read()); print('app.py parses OK')"

      - name: Unit tests (registry, shapes, IO contracts, pipeline regressions)
        run: pytest -q tests/

      - name: Report artifact status (never fails on untrained models)
        run: python scripts/verify_models.py --require none

      - name: Fail if any committed checkpoint fails inference
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("artifacts/status/verify.json")
          if not p.exists():
              print("no verify.json yet (first run) — skipping")
              raise SystemExit(0)
          data = json.loads(p.read_text())
          failed = data.get("infer_failed", [])
          if failed:
              raise SystemExit(f"checkpoints fail inference: {failed}")
          print(f"no inference failures; counts={data.get('counts')}")
          PY

      - name: Assert inference modules contain no training code
        run: |
          ! grep -R "torch.optim" src/inference.py src/lab_inference.py
          ! grep -R "backward(" src/inference.py src/lab_inference.py
          echo "no optimiser / backward in inference modules: OK"
