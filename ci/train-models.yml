name: Train and publish model artifacts

# Manual, resumable training that publishes checkpoints to the Hugging Face Hub.
#
# Design notes
# ------------
# * Each CV model trains in its OWN matrix job, so one failing model can no longer
#   throw away every other model's work (the previous single-job design ran
#   verify_models.py *before* the commit step, so a nonzero exit discarded all
#   freshly trained checkpoints).
# * Checkpoints are NEVER committed to GitHub. They are uploaded to HF_MODEL_REPO
#   by scripts/publish_models.py, which verifies the remote copy by downloading it
#   into a clean directory and running inference with the production loader.
# * Only small metadata (models/manifest.json + artifacts/status/*.json) is
#   committed back to GitHub.
#
# Required repository configuration
# ---------------------------------
#   Secret   HF_TOKEN        fine-grained token with WRITE access to the model repo
#   Variable HF_MODEL_REPO   e.g. KararDeepVision/deep-learning-models
#
# Setup: Settings -> Secrets and variables -> Actions.
# Never paste a token into an issue, a commit, or this file.

on:
  workflow_dispatch:
    inputs:
      train_lab:
        description: "Train the 20-model laboratory"
        required: true
        type: boolean
        default: false
      train_cv:
        description: "Train medical + agriculture CV models"
        required: true
        type: boolean
        default: true
      model_group:
        description: "Which CV group to train"
        required: true
        type: choice
        options: ["all", "medical", "agriculture", "single"]
        default: "all"
      model_id:
        description: "Single model id (used when model_group=single)"
        required: false
        type: string
        default: "brain_cnn"
      cv_epochs:
        description: "Epochs per CV model"
        required: true
        type: choice
        options: ["2", "3", "4"]
        default: "3"
      batch_size:
        description: "Batch size"
        required: true
        type: string
        default: "8"
      include_heavy:
        description: "Also attempt Mask R-CNN (slow, needs several GB RAM)"
        required: true
        type: boolean
        default: false
      resume:
        description: "Resume an interrupted run from artifacts/checkpoints/"
        required: true
        type: boolean
        default: false
      publish:
        description: "Publish verified checkpoints to the Hugging Face Hub"
        required: true
        type: boolean
        default: true
      verify_only:
        description: "Skip training; only verify existing artifacts"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: model-training
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # 1. validate the configuration before spending runner minutes
  # ------------------------------------------------------------------ #
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      models: ${{ steps.resolve.outputs.models }}
      publishable: ${{ steps.resolve.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt pytest
      - name: Compile
        run: python -m compileall -q src scripts app.py tests
      - name: Unit tests
        run: pytest -q tests/
      - name: App smoke test (inference-only guarantees)
        run: python scripts/smoke_app.py
      - name: Resolve the model list
        id: resolve
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from src.registry import BY_ID, CV_MODELS
          group = "${{ inputs.model_group }}"
          single = "${{ inputs.model_id }}"
          if group == "single":
              if single not in BY_ID:
                  raise SystemExit(f"unknown model id: {single}")
              models = [single]
          elif group in ("medical", "agriculture"):
              models = [m.id for m in CV_MODELS if m.area == group]
          else:
              models = [m.id for m in CV_MODELS if not m.is_blocked]
          publishable = [m for m in models if not BY_ID[m].is_blocked]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("models=" + json.dumps(models) + "\n")
              fh.write("publishable=" + json.dumps(publishable) + "\n")
          print("models:", models)
          print("publishable:", publishable)
          PY
      - name: Warn about tracked oversized files
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True, text=True).stdout
          from pathlib import Path
          big = []
          for f in filter(None, out.split("\0")):
              p = Path(f)
              if p.is_file() and p.stat().st_size >= 100 * 1024 * 1024:
                  big.append((f, p.stat().st_size))
          for f, s in big:
              print(f"::warning file={f}::tracked file is {s/1e6:.1f} MB (GitHub limit 100 MB)")
          if big:
              raise SystemExit("Oversized tracked files must be moved to the Hugging Face Hub.")
          print("no tracked file exceeds the GitHub 100 MB limit")
          PY

  # ------------------------------------------------------------------ #
  # 2. train + publish one CV model per matrix job
  # ------------------------------------------------------------------ #
  train-cv:
    name: train ${{ matrix.model }}
    needs: validate
    if: ${{ !inputs.verify_only && inputs.train_cv }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false          # one bad model must not cancel the others
      max-parallel: 2           # stay inside the runner/concurrency budget
      matrix:
        model: ${{ fromJson(needs.validate.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Record runner capacity
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          free -h
      - name: Fetch the dataset(s) this model needs
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, ".")
          from src.registry import BY_ID
          from scripts._fetch_data import DATASETS
          key = BY_ID["${{ matrix.model }}"].dataset_key
          if key in DATASETS:
              sys.exit(subprocess.call([sys.executable, "scripts/_fetch_data.py", key]))
          print(f"{key} needs no parquet download (bundled/lab dataset)")
          PY
      - name: Train (skips a valid existing checkpoint; honours --resume)
        run: |
          EXTRA=""
          if [ "${{ inputs.include_heavy }}" = "true" ]; then EXTRA="--allow-heavy"; fi
          if [ "${{ inputs.resume }}" = "true" ]; then EXTRA="$EXTRA --resume"; fi
          python scripts/train_models.py \
            --model ${{ matrix.model }} \
            --epochs ${{ inputs.cv_epochs }} \
            --batch-size ${{ inputs.batch_size }} \
            $EXTRA
      - name: Publish this model to the Hugging Face Hub (12-step protocol)
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set — skipping publish."
            echo "Add it under Settings -> Secrets and variables -> Actions -> Secrets."
            exit 0
          fi
          if [ -z "$HF_MODEL_REPO" ]; then
            echo "::error::HF_MODEL_REPO variable is not set. Add it under Actions -> Variables."
            exit 1
          fi
          python scripts/publish_models.py --model ${{ matrix.model }}
      - name: Upload status + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.model }}
          path: |
            artifacts/status/
            artifacts/metadata/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------ #
  # 3. optional: the 20-model laboratory
  # ------------------------------------------------------------------ #
  train-lab:
    name: Train the 20-model laboratory
    needs: validate
    if: ${{ !inputs.verify_only && inputs.train_lab }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Train laboratory models
        run: python scripts/train_lab.py --model all
      - name: Publish laboratory artifacts
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN not set — skipping publish."; exit 0
          fi
          python scripts/publish_models.py --all-ready
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-laboratory
          path: artifacts/status/
          if-no-files-found: warn

  # ------------------------------------------------------------------ #
  # 4. aggregate, verify, rebuild the manifest, commit only small files
  # ------------------------------------------------------------------ #
  finalize:
    name: Verify, rebuild the manifest, and commit metadata
    needs: [validate, train-cv]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-train.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
      - name: Download every per-model status artifact
        uses: actions/download-artifact@v4
        with:
          pattern: status-*
          merge-multiple: true
          path: artifacts/
      - name: Report artifact status (never fails merely for untrained models)
        run: python scripts/verify_models.py --require none
      - name: Fail only on real inference failures
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("artifacts/status/verify.json")
          data = json.loads(p.read_text()) if p.exists() else {}
          failed = data.get("infer_failed", [])
          print("counts:", data.get("counts"))
          if failed:
              raise SystemExit(f"checkpoints fail inference: {failed}")
          print("no inference failures")
          PY
      - name: Rebuild models/manifest.json from verified evidence
        env:
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: python scripts/build_manifest.py --remote
      - name: Commit metadata only (never checkpoints)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/manifest.json artifacts/status artifacts/metadata
          if git diff --cached --quiet; then
            echo "No metadata changes to publish."; exit 0
          fi
          git commit -m "chore(models): update manifest and status from training run [skip ci]"
          git push origin HEAD:main
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: |
            artifacts/status/
            models/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Final summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("models/manifest.json")
          if not p.exists():
              print("manifest not built"); raise SystemExit(0)
          m = json.loads(p.read_text())
          print(f"models={m['totals']['models']} ready={len(m['ready_models'])}")
          print("status counts:", m["status_counts"])
          print("ready:", ", ".join(m["ready_models"]) or "(none)")
          PY
