name: Build persistent pretrained models

on:
  push:
    branches: [main]
    paths-ignore:
      - pretrained_weights.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<3' 'scikit-learn<2' 'scipy<2' 'torch>=2.2,<3'
      - name: Train all 20 models once on real datasets
        run: python build_pretrained.py
      - name: Commit bundled weights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pretrained_weights.py
          git diff --cached --quiet || git commit -m 'chore: add persistent pretrained weights'
          git push
