name: Streamlit validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dashboard dependencies
        run: pip install streamlit pillow numpy
      - name: Compile Streamlit app
        run: python -m py_compile streamlit_app.py
