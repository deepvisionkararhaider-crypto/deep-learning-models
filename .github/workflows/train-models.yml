name: Train models and publish artifacts

on:
  workflow_dispatch:
    inputs:
      train_lab:
        description: "Train lab models (20-model suite)"
        required: true
        type: boolean
        default: true
      train_cv:
        description: "Train medical and agriculture models"
        required: true
        type: boolean
        default: true
      cv_epochs:
        description: "Epochs per CV model"
        required: true
        type: choice
        options:
          - "2"
          - "3"
          - "4"
        default: "2"

permissions:
  contents: write

concurrency:
  group: model-training
  cancel-in-progress: false

jobs:
  train:
    name: Train, validate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Record runner capacity
        run: |
          python --version
          python -c "import torch; print('PyTorch:', torch.__version__); print('CUDA available:', torch.cuda.is_available())"
          free -h
          df -h .

      - name: Train lab models (skip valid existing artifacts)
        if: ${{ inputs.train_lab }}
        run: python scripts/train_lab.py --model all

      - name: Train medical and agriculture models (skip valid existing artifacts)
        if: ${{ inputs.train_cv }}
        run: python scripts/train_models.py --model all --epochs ${{ inputs.cv_epochs }} --batch-size 8

      - name: Verify all saved artifacts and inference smoke tests
        run: python scripts/verify_models.py

      - name: Check artifact sizes before publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [p for p in Path("artifacts").rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"{len(files)} artifact files, {total / 1024 / 1024:.1f} MiB total")
          oversized = [(str(p), p.stat().st_size) for p in files if p.stat().st_size >= 100 * 1024 * 1024]
          if oversized:
              for name, size in oversized:
                  print(f"GitHub regular-file limit exceeded: {name} ({size / 1024 / 1024:.1f} MiB)")
              raise SystemExit("Use Git LFS or external artifact storage for oversized model files.")
          PY

      - name: Commit and push updated model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if git diff --cached --quiet; then
            echo "No artifact changes to publish."
            exit 0
          fi
          git commit -m "Train and publish verified model artifacts [skip ci]"
          git push origin HEAD:main

      - name: Upload training logs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-training-logs
          path: artifacts/metadata/
          if-no-files-found: warn
          retention-days: 14
