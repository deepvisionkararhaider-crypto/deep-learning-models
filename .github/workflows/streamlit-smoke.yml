name: Streamlit Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-streamlit.txt
      - name: Compile applications
        run: |
          python -m py_compile app.py
          python -m py_compile streamlit_app.py
          python -m py_compile yolo_page.py
      - name: Import application
        run: python -c "import app; print('Streamlit app import: OK')"
      - name: Test YOLO detection helpers
        run: |
          python -c "
          import yolo_page as y
          img = y._make_demo_image(7)
          kept = y.nms(y.detect_objects(img))
          assert len(kept) >= 1, 'expected at least one detection'
          print('YOLO detection helpers: OK, boxes =', len(kept))
          "
      - name: Compile YOLO model
        run: python -m py_compile 16_yolo/model.py
