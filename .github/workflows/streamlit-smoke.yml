name: Streamlit Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-streamlit.txt
      - name: Compile application
        run: python -m py_compile app.py
      - name: Import application
        run: python -c "import app; print('Streamlit app import: OK')"
